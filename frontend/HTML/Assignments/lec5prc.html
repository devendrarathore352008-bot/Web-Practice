<!--     Create three types of form: (1.) Login Form, (2.) Register Form, (3) Sign Up Form       -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment Of Lec 5</title>
  </head>
  <body>
    <!-- CREATING LOGIN FORM -->
    <div>

    <h2>Welcome Back</h2>

    <h3>Login Form</h3>

    <form>
      <div>
        <lable for="login-username">Username or Email</lable><br />
        <input
          type="text"
          placeholder="abcd12@example.com"
          name="username"
          required
        /><br /><br />
      </div>

      <div>
        <label for="login-password">Password</label><br />
        <input type="password" name="password" required /><br /><br />
      </div>

      <div>
        <button type="submit">Login</button>
      </div>
    </form>

    </div>

    <hr />

    <!-- CREATING REGISTER FORM -->
    <div>

    <h2>Register Form</h2>

    <form>
      <div>
        <label for="reg-username">Username</label><br />
        <input
          type="text"
          placeholder="Example@2345"
          name="username"
          required
        /><br /><br />
      </div>

      <div>
        <label for="reg-email">Email</label><br />
        <input
          type="text"
          placeholder="abcd12345@example.com"
          name="email"
          required
        /><br /><br />
      </div>

      <div>
        <label for="reg-password">Password</label><br />
        <input
          type="password"
          placeholder="Example@1234"
          name="password"
          required
        /><br /><br />
      </div>

      <div>
        <label for="reg-confirm-password">Confirm Password</label><br />
        <input
          type="password"
          placeholder="Example@1234"
          name="confirm-password"
          required
        /><br /><br />
      </div>

      <div>
        <button type="submit">Register</button>
      </div>
    </form>

    </div>

    <hr />

    <!-- CREATING SIGNUP FORM -->

    <div>

    <h2>Signup Form</h2>

    <form>
      <div>
        <label for="signup-firstname">First Name</label><br />
        <input
          type="text"
          placeholder="Devendra"
          name="firstname"
          required
        /><br /><br />
      </div>

      <div>
        <label for="signup-lastname">Last Name</label><br />
        <input type="text" placeholder="Rathore" name="lastname" /><br /><br />
      </div>

      <div>
        <label for="signup-email">Email</label><br />
        <input
          type="text"
          placeholder="dev3458@gmail.com"
          name="email"
        /><br /><br />
      </div>

      <div>
        <label for="signup-dob">Date Of Birth</label><br />
        <input type="date" name="dob" required /><br /><br />
      </div>

      <div>
        <label for="signup-password">Password</label><br />
        <input type="password" name="password" required /><br /><br />
      </div>

      <div>
        <button type="submit">Sign Up</button>
      </div><br />

      <div>
        <input type="checkbox" name="checkbox" required />
        <label for="checkbox">Accept All Terms & Conditions</label>
      </div>

    </form>

    </div>

    <hr>

    <p>&copy; Copyright, 2026 Devendra Rathore. All rights reserved.</p> 

  </body>
</html>
