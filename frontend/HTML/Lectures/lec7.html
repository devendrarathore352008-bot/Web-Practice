<!--                             SEMANTIC TAGS                                                  
            
    The tags that has been used for particular purpose or have meaning of it.
        
        Example: <p> tag for paragraph writing
                 <ul> tag for list


-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Page</title>
</head>
<body>

    <!-- Forget About What is written Inside Header-->

    <!-- Header tag is a semantic tag which specifies the upper header section on the website    -->
     
    <!-- Nav Tag is used for navigation section where we go on different web pages-->

    <!-- 
    
    Anchor Tag <a></a> , we used it to link different another webpages on that particular text or logo or button  
     
    Inside <a href="Here we give path of webpage"></a>
    We use href for hypyerlink to render on different webpages
    -->

    <header>
        <!-- Logo -->
        
         <div>
            <a href="./index.html"><img src="./image/small_logo.png" alt="dysank small logo" height="35"></a>
            <img src="./image/large_logo.png" alt="dysank large logo" height="35">
         </div>

        <!-- Nav link -->
         <nav>
            <ul>
                <li> <a href="./index.html">Home Page</a></li>
                <li> <a href="./about.html">About Us</a> </li>
                <li> <a href="./student.html">For Student</a> </li>
                <li> <a href="./tutor.html">For Tutor</a></li>
                <li> <a href="./contact.html">Contact Us</a></li>
            </ul>
         </nav>

         <!-- Login & Register Buttons-->
         <div>
            <a href="./register.html"><button>Register</button></a>
            <a href="./login.html"><button>Login</button></a>
         </div>
    </header>


</body>
</html>
