  <body>

    <!--                   Practicing The Previous Lecture 5 Of Form Tag                    -->

    <div>
      <h2>Welcome To Registration Page</h2>

      <form>
        <div>
          <lable for="reg-name">Full Name</lable><br />
          <input type="text" placeholder="David Anthony" required />
        </div>

        <div>
          <label for="gender">Gender</label>
          <select name="id">
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="others">Others</option>
          </select>
        </div>

        <div>
          <label for="DOB">DOB</label>
          <input type="date" />
        </div>

        <div>
          <label for="mobile number">Mobile Number</label><br />
          <select name="id">
            <option value="+91">+91 IND</option>
            <option value="+845">+845 USA</option>
          </select>
          <input type="number" placeholder="Enter Your Number" />
        </div>

        <div>
          <label for="reg-email">Email</label><br />
          <input
            type="text"
            placeholder="abcd12345@example.com"
            name="email"
            required
          />
        </div>

        <div>
          <label for="reg-password">Password</label><br />
          <input
            type="password"
            name="password"
            required
            
          />
          <small>Must include a capital letter and numbers</small>
          
        </div>

        <div>
          <label for="reg-confirm-password">Confirm Password</label><br />
          <input
            type="password"
            name="confirm-password"
            required
          />
          <small>Must include a capital letter and numbers</small>
        </div>

        <div>
          <button type="submit">Register</button>
        </div>
      </form>
    </div>
