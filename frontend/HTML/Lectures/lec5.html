<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lecture 5</title>
  </head>
  <body>
    <!--                                USING FORM TAG                                      -->

    <!--                            <form></form>                                     -->
    <!--                                                               
            1. <label> tag is used for specific section of a category like student name.
            2. <input> tag is used for take input from the user inside a box.
        
        -->
    
    <!--    <div> tag is used for particular section and to write in correct format              -->



    <form>
      <div>
        <label for=""> Student Name </label> <br>

        <input
          type="text"
          placeholder="For Ex: Shiv"  
          maxlength="30"
          minlength="1"
        />

        <!-- 
        
        placeholder is used for to show what to put in the input section on the website. I is like example for better understand of user on the website.            
         
        -->


      </div> <br>
       

    <!--   Using div tag for Student DOB section                  -->


      <div>
        <label for=""> Student DOB </label><br>

        <input type="date" />
      </div> <br>

    <!--   Using div tag for student phone no. section                  -->

      <div>
        <label for=""> Student Phone No. </label> <br>

        <input
          type="number"
          placeholder="For Ex: 9999235554"
          maxlength="10"
          minlength="10"
        />
      </div> <br>

    </form>
  </body>
</html>
