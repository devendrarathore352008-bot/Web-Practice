<!DOCTYPE html>
<html lang="en">

<!-- Use Image,Audio and Video Tag in correct Manner-->

<body>
    <h1>USING DIFFERENT TAGS</h1><br>

    <hr>

    <h2>------Image Tag------</h2>
    <img
    src="../Material/batman.jpg" 
    width="720"
    height="400"
    alt="Image"
    >
    
    <h2>------Audio Tag------</h2>
    <audio 
    controls>
    <source 
    src="../Material/song.mp3"
    type="audio/mpeg">

    </audio>

    <hr>


    <h2>------Video Tag------</h2>

    <video
    controls>
    <source
    src="../Material/45.mp4"
    type="video/mp4">



    </video>











    
</body>
</html>
